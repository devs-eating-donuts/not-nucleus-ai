<svg width="192" height="192" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Big Head Bignetti">
  <!-- Pete cast: Big Head Bignetti — QA by ambient luck. Original character:
       sandy bowl fringe, wide innocent eyes, little "oh" mouth, zip jacket. -->
  <defs>
    <clipPath id="disc-bb"><circle cx="48" cy="48" r="45"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#e3efe0"/>
  <g clip-path="url(#disc-bb)">
    <!-- neck -->
    <rect x="43" y="56" width="10" height="12" fill="#f2d5b8" stroke="#24352c" stroke-width="2"/>
    <!-- zip jacket -->
    <path d="M13 100 C19 76 31 67 48 67 C65 67 77 76 83 100 Z" fill="#69a6a1" stroke="#24352c" stroke-width="2.4"/>
    <line x1="48" y1="68" x2="48" y2="98" stroke="#4d817c" stroke-width="2.4"/>
    <circle cx="48" cy="74" r="1.6" fill="#f1e9d2" stroke="#24352c" stroke-width="1.2"/>
    <path d="M38 68 C41 72 44 73 47 73" stroke="#4d817c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M58 68 C55 72 52 73 49 73" stroke="#4d817c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- ears -->
    <circle cx="30.5" cy="45" r="3.6" fill="#f2d5b8" stroke="#24352c" stroke-width="2"/>
    <circle cx="65.5" cy="45" r="3.6" fill="#f2d5b8" stroke="#24352c" stroke-width="2"/>
    <!-- head -->
    <circle cx="48" cy="44" r="17.5" fill="#f2d5b8" stroke="#24352c" stroke-width="2.4"/>
    <!-- floppy bowl fringe -->
    <path d="M30.5 42 C29 24.5 39 20.5 48 20.5 C57 20.5 67 24.5 65.5 42 C65 33.5 60 30 48 30 C36 30 31 33.5 30.5 42 Z" fill="#c9a55f" stroke="#24352c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M38 31.5 C39.5 33.5 41.5 34 43 33" stroke="#24352c" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M53 33 C54.5 34 56.5 33.5 58 31.5" stroke="#24352c" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- both brows up, permanently -->
    <path d="M37.5 35.5 Q40.5 33.5 44 35" stroke="#24352c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M52 35 Q55.5 33.5 58.5 35.5" stroke="#24352c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- wide innocent eyes -->
    <circle cx="41.5" cy="43.5" r="3.4" fill="#ffffff" stroke="#24352c" stroke-width="1.8"/>
    <circle cx="54.5" cy="43.5" r="3.4" fill="#ffffff" stroke="#24352c" stroke-width="1.8"/>
    <circle cx="41.8" cy="44" r="1.8" fill="#24352c"/>
    <circle cx="54.2" cy="44" r="1.8" fill="#24352c"/>
    <!-- little "oh" mouth -->
    <ellipse cx="48" cy="55.5" rx="2.4" ry="3" fill="#8a5a44" stroke="#24352c" stroke-width="1.8"/>
  </g>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#24352c" stroke-width="2.4"/>
</svg>

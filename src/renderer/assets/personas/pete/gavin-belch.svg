<svg width="192" height="192" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gavin Belch">
  <!-- Pete cast: Gavin Belch — the corporate antagonist. Original character:
       silver swept hair, black turtleneck under a charcoal blazer, scheming. -->
  <defs>
    <clipPath id="disc-gb"><circle cx="48" cy="48" r="45"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#d6e3e0"/>
  <g clip-path="url(#disc-gb)">
    <!-- neck -->
    <rect x="43" y="56" width="10" height="12" fill="#edd0b4" stroke="#24352c" stroke-width="2"/>
    <!-- charcoal blazer -->
    <path d="M13 100 C19 76 31 67 48 67 C65 67 77 76 83 100 Z" fill="#333936" stroke="#24352c" stroke-width="2.4"/>
    <!-- black turtleneck -->
    <path d="M38.5 63 C42 61 54 61 57.5 63 L57.5 70 C52.5 67.5 43.5 67.5 38.5 70 Z" fill="#1c1917" stroke="#24352c" stroke-width="2" stroke-linejoin="round"/>
    <!-- lapel lines + a small teal pin -->
    <path d="M40 70 L34 84" stroke="#24352c" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M56 70 L62 84" stroke="#24352c" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="59" cy="77" r="1.8" fill="#2cc5b8" stroke="#24352c" stroke-width="1.2"/>
    <!-- ears -->
    <circle cx="30.5" cy="45" r="3.6" fill="#edd0b4" stroke="#24352c" stroke-width="2"/>
    <circle cx="65.5" cy="45" r="3.6" fill="#edd0b4" stroke="#24352c" stroke-width="2"/>
    <!-- head -->
    <circle cx="48" cy="44" r="17.5" fill="#edd0b4" stroke="#24352c" stroke-width="2.4"/>
    <!-- silver swept hair -->
    <path d="M30.5 39 C29.5 24.5 39 21.5 48 21.5 C57 21.5 66.5 24.5 65.5 39 C63 30 56 28.5 48 28.5 C40 28.5 33 30 30.5 39 Z" fill="#b9bdb9" stroke="#24352c" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- one raised brow, narrow eyes -->
    <path d="M37.5 37.5 L44 37.5" stroke="#24352c" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M52 35 Q55.5 33.8 58.5 35.5" stroke="#24352c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <line x1="39.3" y1="42" x2="43.7" y2="42" stroke="#24352c" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="52.3" y1="42" x2="56.7" y2="42" stroke="#24352c" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="41.5" cy="43.6" r="1.7" fill="#24352c"/>
    <circle cx="54.5" cy="43.6" r="1.7" fill="#24352c"/>
    <!-- thin acquisitive smile -->
    <path d="M44 54.5 Q49 56 52.5 53.8" stroke="#24352c" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#24352c" stroke-width="2.4"/>
</svg>

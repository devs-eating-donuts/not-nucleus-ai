<svg width="192" height="192" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gilfoyle Zerotrust">
  <!-- Pete cast: Gilfoyle Zerotrust — deadpan security. Original character:
       flat dark hair, full beard, heavy brows, black tee, zero-trust shield pin. -->
  <defs>
    <clipPath id="disc-gz"><circle cx="48" cy="48" r="45"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#d5e0dd"/>
  <g clip-path="url(#disc-gz)">
    <!-- neck -->
    <rect x="43" y="56" width="10" height="12" fill="#ecd0b0" stroke="#24352c" stroke-width="2"/>
    <!-- black tee -->
    <path d="M13 100 C19 76 31 67 48 67 C65 67 77 76 83 100 Z" fill="#26221f" stroke="#24352c" stroke-width="2.4"/>
    <path d="M40 68 C42 72 54 72 56 68" fill="none" stroke="#161311" stroke-width="3" stroke-linecap="round"/>
    <!-- zero-trust shield pin -->
    <path d="M62 78 L68 80 L68 85 C68 88.5 65.5 90.5 62 92 C58.5 90.5 56 88.5 56 85 L56 80 Z" fill="#2cc5b8" stroke="#24352c" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- ears -->
    <circle cx="30.5" cy="45" r="3.6" fill="#ecd0b0" stroke="#24352c" stroke-width="2"/>
    <circle cx="65.5" cy="45" r="3.6" fill="#ecd0b0" stroke="#24352c" stroke-width="2"/>
    <!-- head -->
    <circle cx="48" cy="44" r="17.5" fill="#ecd0b0" stroke="#24352c" stroke-width="2.4"/>
    <!-- full beard around the jaw -->
    <path d="M31.5 45 C32.5 62 40 67.5 48 67.5 C56 67.5 63.5 62 64.5 45 C63 51 60 53.5 57.5 54 C57.5 58.5 53.5 60.5 48 60.5 C42.5 60.5 38.5 58.5 38.5 54 C36 53.5 33 51 31.5 45 Z" fill="#2a2622" stroke="#24352c" stroke-width="2" stroke-linejoin="round"/>
    <!-- flat mouth inside the beard -->
    <line x1="44.5" y1="56.5" x2="51.5" y2="56.5" stroke="#8a7460" stroke-width="2" stroke-linecap="round"/>
    <!-- flat straight-fringe hair -->
    <path d="M30.5 41 C29.5 26.5 39 21.5 48 21.5 C57 21.5 66.5 26.5 65.5 41 C65.5 35 61 32 48 32 C35 32 30.5 35 30.5 41 Z" fill="#2a2622" stroke="#24352c" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- heavy flat brows -->
    <line x1="37" y1="38" x2="44" y2="38" stroke="#24352c" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="38" x2="59" y2="38" stroke="#24352c" stroke-width="3" stroke-linecap="round"/>
    <!-- half-lidded eyes -->
    <line x1="38.8" y1="42.8" x2="44.2" y2="42.8" stroke="#24352c" stroke-width="2" stroke-linecap="round"/>
    <line x1="51.8" y1="42.8" x2="57.2" y2="42.8" stroke="#24352c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="41.5" cy="44.6" r="1.8" fill="#24352c"/>
    <circle cx="54.5" cy="44.6" r="1.8" fill="#24352c"/>
  </g>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#24352c" stroke-width="2.4"/>
</svg>

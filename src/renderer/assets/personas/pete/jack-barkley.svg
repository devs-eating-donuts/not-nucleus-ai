<svg width="192" height="192" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jack Barkley">
  <!-- Pete cast: Jack Barkley — "Action Jack". Original character: silver side
       part, salesman smile, and a tie that is, on close inspection, a triangle. -->
  <defs>
    <clipPath id="disc-jb"><circle cx="48" cy="48" r="45"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#e4ecdc"/>
  <g clip-path="url(#disc-jb)">
    <!-- neck -->
    <rect x="43" y="56" width="10" height="12" fill="#f2d5b8" stroke="#24352c" stroke-width="2"/>
    <!-- suit with a white shirt V -->
    <path d="M13 100 C19 76 31 67 48 67 C65 67 77 76 83 100 Z" fill="#0b4f4a" stroke="#24352c" stroke-width="2.4"/>
    <path d="M41 67 L48 76 L55 67 L53 65.5 L48 69 L43 65.5 Z" fill="#f6f2e6" stroke="#24352c" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- the conjoined-triangle tie -->
    <path d="M45.8 68 L50.2 68 L48 72 Z" fill="#309e4a" stroke="#24352c" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M46.5 71.5 L49.5 71.5 L48.6 84 L47.4 84 Z" fill="#309e4a" stroke="#24352c" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- ears -->
    <circle cx="30.5" cy="45" r="3.6" fill="#f2d5b8" stroke="#24352c" stroke-width="2"/>
    <circle cx="65.5" cy="45" r="3.6" fill="#f2d5b8" stroke="#24352c" stroke-width="2"/>
    <!-- head -->
    <circle cx="48" cy="44" r="17.5" fill="#f2d5b8" stroke="#24352c" stroke-width="2.4"/>
    <!-- silver side part -->
    <path d="M30.5 39 C30 25.5 38 22 48 22 C58 22 66 25.5 65.5 39 C64 31 57.5 29.5 49.5 30.2 C44 27.8 34 30.5 30.5 39 Z" fill="#cfd2cd" stroke="#24352c" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- bushy gray brows -->
    <line x1="37.2" y1="36.5" x2="44" y2="36.2" stroke="#9aa39d" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="36.2" x2="58.8" y2="36.5" stroke="#9aa39d" stroke-width="3" stroke-linecap="round"/>
    <!-- friendly eyes with crow's feet -->
    <circle cx="41.5" cy="43.5" r="1.9" fill="#24352c"/>
    <circle cx="54.5" cy="43.5" r="1.9" fill="#24352c"/>
    <path d="M36.7 42.2 L34.8 41.4" stroke="#24352c" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M59.3 42.2 L61.2 41.4" stroke="#24352c" stroke-width="1.4" stroke-linecap="round"/>
    <!-- the salesman smile -->
    <path d="M42 52.5 Q48 58.5 54 52.5 C52.5 56.5 43.5 56.5 42 52.5 Z" fill="#ffffff" stroke="#24352c" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#24352c" stroke-width="2.4"/>
</svg>

<svg width="192" height="192" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jared Dunnison">
  <!-- Pete cast: Jared Dunnison — operations, quietly and without recognition.
       Original character: tidy blond side part, sweater vest over a collared shirt. -->
  <defs>
    <clipPath id="disc-jd"><circle cx="48" cy="48" r="45"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#d9e8e6"/>
  <g clip-path="url(#disc-jd)">
    <!-- neck -->
    <rect x="43" y="56" width="10" height="12" fill="#f6e3cd" stroke="#24352c" stroke-width="2"/>
    <!-- sweater vest -->
    <path d="M13 100 C19 76 31 67 48 67 C65 67 77 76 83 100 Z" fill="#8fb8a8" stroke="#24352c" stroke-width="2.4"/>
    <!-- shirt collar points -->
    <path d="M41.5 66.5 L48 72.5 L54.5 66.5 L52 64.5 L48 67.5 L44 64.5 Z" fill="#f6f2e6" stroke="#24352c" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- vest V-line -->
    <path d="M41.5 68 L48 78 L54.5 68" stroke="#6d998a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- ears -->
    <circle cx="30.5" cy="45" r="3.6" fill="#f6e3cd" stroke="#24352c" stroke-width="2"/>
    <circle cx="65.5" cy="45" r="3.6" fill="#f6e3cd" stroke="#24352c" stroke-width="2"/>
    <!-- head -->
    <circle cx="48" cy="44" r="17.5" fill="#f6e3cd" stroke="#24352c" stroke-width="2.4"/>
    <!-- tidy blond side part -->
    <path d="M30.5 39 C30 25.5 38 22.5 48 22.5 C58 22.5 66 25.5 65.5 39 C64 30.5 55.5 29 46.5 29.8 C39.5 27.5 33 31 30.5 39 Z" fill="#d8c07c" stroke="#24352c" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- earnest raised brows -->
    <path d="M37.5 36 Q40.5 34.5 44 35.5" stroke="#24352c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M52 35.5 Q55.5 34.5 58.5 36" stroke="#24352c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- gentle eyes -->
    <circle cx="41.5" cy="43.5" r="1.9" fill="#24352c"/>
    <circle cx="54.5" cy="43.5" r="1.9" fill="#24352c"/>
    <!-- kind smile -->
    <path d="M44 54 Q48 56.5 52 54" stroke="#24352c" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#24352c" stroke-width="2.4"/>
</svg>

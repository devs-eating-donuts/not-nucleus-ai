<svg width="192" height="192" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Monica Hallmark">
  <!-- Pete cast: Monica Hallmark — the project lead who has read both the term
       sheet and the code. Original character: honey bob, teal blazer, mint top. -->
  <defs>
    <clipPath id="disc-mh"><circle cx="48" cy="48" r="45"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#cfe6d8"/>
  <g clip-path="url(#disc-mh)">
    <!-- hair mass behind the head -->
    <path d="M29 36 C29 22.5 67 22.5 67 36 L68 60 C68 65 63.5 67 60 65 L59.5 42 C55 36.5 41 36.5 36.5 42 L36 65 C32.5 67 28 65 28 60 Z" fill="#7a4a22" stroke="#24352c" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- neck -->
    <rect x="43" y="56" width="10" height="12" fill="#f0cdaa" stroke="#24352c" stroke-width="2"/>
    <!-- blazer torso with mint V-neck -->
    <path d="M13 100 C19 76 31 67 48 67 C65 67 77 76 83 100 Z" fill="#0b4f4a" stroke="#24352c" stroke-width="2.4"/>
    <path d="M41 68 L48 80 L55 68 C52 66.5 44 66.5 41 68 Z" fill="#c9e4d6" stroke="#24352c" stroke-width="2" stroke-linejoin="round"/>
    <!-- ears + earrings -->
    <circle cx="30.5" cy="45" r="3.6" fill="#f0cdaa" stroke="#24352c" stroke-width="2"/>
    <circle cx="65.5" cy="45" r="3.6" fill="#f0cdaa" stroke="#24352c" stroke-width="2"/>
    <circle cx="30" cy="50.5" r="1.8" fill="#309e4a" stroke="#24352c" stroke-width="1.4"/>
    <circle cx="66" cy="50.5" r="1.8" fill="#309e4a" stroke="#24352c" stroke-width="1.4"/>
    <!-- head -->
    <circle cx="48" cy="44" r="17.5" fill="#f0cdaa" stroke="#24352c" stroke-width="2.4"/>
    <!-- side-part fringe -->
    <path d="M30.5 41 C30 27 39.5 23 49 23.5 C59 24 65.5 29.5 65.5 41 C61 33.5 53.5 31.5 49.5 32.5 C44 30 34.5 33.5 30.5 41 Z" fill="#7a4a22" stroke="#24352c" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- neat brows -->
    <path d="M37.5 37 Q41 35.5 44 36.8" stroke="#24352c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M52 36.8 Q55 35.5 58.5 37" stroke="#24352c" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- eyes + lashes -->
    <circle cx="41.5" cy="43.5" r="1.9" fill="#24352c"/>
    <circle cx="54.5" cy="43.5" r="1.9" fill="#24352c"/>
    <line x1="38.7" y1="41.4" x2="36.9" y2="40.4" stroke="#24352c" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="57.3" y1="41.4" x2="59.1" y2="40.4" stroke="#24352c" stroke-width="1.6" stroke-linecap="round"/>
    <!-- calm knowing smile -->
    <path d="M44 54.5 Q48 57 52 54.5" stroke="#24352c" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#24352c" stroke-width="2.4"/>
</svg>

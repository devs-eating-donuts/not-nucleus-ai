<svg width="192" height="192" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Peter Gregorix">
  <!-- Pete cast: Peter Gregorix — investor emeritus. Original character: bald
       with side tufts, rectangular glasses, bow tie, gaze fixed on an idea
       that fits on one index card. -->
  <defs>
    <clipPath id="disc-pg"><circle cx="48" cy="48" r="45"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#e6eee6"/>
  <g clip-path="url(#disc-pg)">
    <!-- neck -->
    <rect x="43" y="56" width="10" height="12" fill="#f0d6ba" stroke="#24352c" stroke-width="2"/>
    <!-- tan blazer over an ivory shirt -->
    <path d="M13 100 C19 76 31 67 48 67 C65 67 77 76 83 100 Z" fill="#b08d5f" stroke="#24352c" stroke-width="2.4"/>
    <path d="M42 67.5 L48 74 L54 67.5 L54 66 L42 66 Z" fill="#f6f2e6" stroke="#24352c" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- green bow tie -->
    <path d="M41 68.5 L47 71.5 L41 74.5 Z" fill="#309e4a" stroke="#24352c" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M55 68.5 L49 71.5 L55 74.5 Z" fill="#309e4a" stroke="#24352c" stroke-width="1.8" stroke-linejoin="round"/>
    <rect x="46.4" y="69.9" width="3.2" height="3.2" rx="1" fill="#267a3a" stroke="#24352c" stroke-width="1.4"/>
    <!-- ears -->
    <circle cx="30.5" cy="45" r="3.6" fill="#f0d6ba" stroke="#24352c" stroke-width="2"/>
    <circle cx="65.5" cy="45" r="3.6" fill="#f0d6ba" stroke="#24352c" stroke-width="2"/>
    <!-- bald head -->
    <circle cx="48" cy="44" r="17.5" fill="#f0d6ba" stroke="#24352c" stroke-width="2.4"/>
    <!-- gray side tufts -->
    <path d="M30.6 41 C30 46 31 50 33 53 C31.5 48 32 44 33.5 41 Z" fill="#b3ada0" stroke="#24352c" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M65.4 41 C66 46 65 50 63 53 C64.5 48 64 44 62.5 41 Z" fill="#b3ada0" stroke="#24352c" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- faint brows, mid-thought -->
    <path d="M38 36.5 L43.5 36.2" stroke="#24352c" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M52.5 36.2 L58 36.5" stroke="#24352c" stroke-width="1.8" stroke-linecap="round"/>
    <!-- rectangular glasses, eyes drifting up and to the left -->
    <rect x="35.8" y="40.5" width="11" height="7.5" rx="2" fill="rgba(255,255,255,0.35)" stroke="#24352c" stroke-width="2"/>
    <rect x="49.2" y="40.5" width="11" height="7.5" rx="2" fill="rgba(255,255,255,0.35)" stroke="#24352c" stroke-width="2"/>
    <line x1="46.8" y1="43" x2="49.2" y2="43" stroke="#24352c" stroke-width="2"/>
    <line x1="35.8" y1="44" x2="33" y2="44" stroke="#24352c" stroke-width="2"/>
    <line x1="60.2" y1="44" x2="63" y2="44" stroke="#24352c" stroke-width="2"/>
    <circle cx="40.6" cy="43.2" r="1.7" fill="#24352c"/>
    <circle cx="53.6" cy="43.2" r="1.7" fill="#24352c"/>
    <!-- barely-there mouth -->
    <line x1="45.5" y1="55" x2="50.5" y2="54.8" stroke="#24352c" stroke-width="2" stroke-linecap="round"/>
  </g>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#24352c" stroke-width="2.4"/>
</svg>

<svg width="192" height="192" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Richard Henderstack">
  <!-- Pete cast: Richard Henderstack — anxious founder-architect. Original
       character: round glasses, auburn cowlick, teal hoodie. -->
  <defs>
    <clipPath id="disc-rh"><circle cx="48" cy="48" r="45"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#dcefe4"/>
  <g clip-path="url(#disc-rh)">
    <!-- neck -->
    <rect x="43" y="56" width="10" height="12" fill="#f2d5b8" stroke="#24352c" stroke-width="2"/>
    <!-- hoodie torso -->
    <path d="M13 100 C19 76 31 67 48 67 C65 67 77 76 83 100 Z" fill="#077068" stroke="#24352c" stroke-width="2.4"/>
    <!-- hood collar + drawstrings -->
    <path d="M33 76 C35 67 41 63.5 48 63.5 C55 63.5 61 67 63 76" fill="none" stroke="#065a54" stroke-width="5" stroke-linecap="round"/>
    <line x1="44" y1="72" x2="43" y2="81" stroke="#f1e9d2" stroke-width="2" stroke-linecap="round"/>
    <line x1="52" y1="72" x2="53" y2="81" stroke="#f1e9d2" stroke-width="2" stroke-linecap="round"/>
    <!-- ears -->
    <circle cx="30.5" cy="45" r="3.6" fill="#f2d5b8" stroke="#24352c" stroke-width="2"/>
    <circle cx="65.5" cy="45" r="3.6" fill="#f2d5b8" stroke="#24352c" stroke-width="2"/>
    <!-- head -->
    <circle cx="48" cy="44" r="17.5" fill="#f2d5b8" stroke="#24352c" stroke-width="2.4"/>
    <!-- hair: messy fringe + cowlick -->
    <path d="M30.5 43 C30 28 38 23.5 48 23.5 C58 23.5 66 28 65.5 43 C62 35 58.5 33 54 34 C50.5 31 45.5 31 42 34 C37.5 33 34 35 30.5 43 Z" fill="#a05f2c" stroke="#24352c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M53 24.5 C54.5 19.5 59 19 60 22 C57.5 21 55 22.5 53 24.5 Z" fill="#a05f2c" stroke="#24352c" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- worried brows -->
    <path d="M37.5 37 L43.5 35" stroke="#24352c" stroke-width="2" stroke-linecap="round"/>
    <path d="M52.5 35 L58.5 37" stroke="#24352c" stroke-width="2" stroke-linecap="round"/>
    <!-- round glasses + eyes -->
    <circle cx="41.5" cy="44" r="5.4" fill="rgba(255,255,255,0.35)" stroke="#24352c" stroke-width="2"/>
    <circle cx="54.5" cy="44" r="5.4" fill="rgba(255,255,255,0.35)" stroke="#24352c" stroke-width="2"/>
    <line x1="46.9" y1="43" x2="49.1" y2="43" stroke="#24352c" stroke-width="2"/>
    <line x1="36.1" y1="44" x2="33" y2="44" stroke="#24352c" stroke-width="2"/>
    <line x1="59.9" y1="44" x2="63" y2="44" stroke="#24352c" stroke-width="2"/>
    <circle cx="41.5" cy="44.5" r="1.8" fill="#24352c"/>
    <circle cx="54.5" cy="44.5" r="1.8" fill="#24352c"/>
    <!-- small worried mouth -->
    <path d="M44.5 56 Q48 54.5 51.5 56" stroke="#24352c" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#24352c" stroke-width="2.4"/>
</svg>

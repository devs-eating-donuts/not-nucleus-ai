<svg width="192" height="192" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Russ Hanneford">
  <!-- Pete cast: Russ Hanneford — three commas. Original character: slicked-back
       hair, amber sunglasses, deep-V shirt, gold chain, unearned grin. -->
  <defs>
    <clipPath id="disc-rf"><circle cx="48" cy="48" r="45"/></clipPath>
  </defs>
  <circle cx="48" cy="48" r="45" fill="#dff0e0"/>
  <g clip-path="url(#disc-rf)">
    <!-- neck -->
    <rect x="43" y="56" width="10" height="12" fill="#e0b088" stroke="#24352c" stroke-width="2"/>
    <!-- black shirt, unbuttoned to a deep V -->
    <path d="M13 100 C19 76 31 67 48 67 C65 67 77 76 83 100 Z" fill="#26221f" stroke="#24352c" stroke-width="2.4"/>
    <path d="M42.5 67 L48 79 L53.5 67 C51 65.5 45 65.5 42.5 67 Z" fill="#e0b088" stroke="#24352c" stroke-width="2" stroke-linejoin="round"/>
    <!-- gold chain -->
    <path d="M37 72 Q48 81 59 72" stroke="#d9b23a" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle cx="48" cy="77.5" r="2" fill="#d9b23a" stroke="#24352c" stroke-width="1.2"/>
    <!-- ears -->
    <circle cx="30.5" cy="45" r="3.6" fill="#e0b088" stroke="#24352c" stroke-width="2"/>
    <circle cx="65.5" cy="45" r="3.6" fill="#e0b088" stroke="#24352c" stroke-width="2"/>
    <!-- head -->
    <circle cx="48" cy="44" r="17.5" fill="#e0b088" stroke="#24352c" stroke-width="2.4"/>
    <!-- slicked-back hair with a shine line -->
    <path d="M30.5 40 C30 24.5 38 20.5 48 20.5 C58 20.5 66 24.5 65.5 40 C65 30.5 58 27.5 48 27.5 C38 27.5 31 30.5 30.5 40 Z" fill="#241f1c" stroke="#24352c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M38 24.5 C42 22.8 52 22.8 57 24.5" stroke="#4a423c" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- amber sunglasses -->
    <rect x="35.5" y="39.5" width="11.5" height="8.5" rx="3.5" fill="#d98e3a" opacity="0.9" stroke="#24352c" stroke-width="2"/>
    <rect x="49" y="39.5" width="11.5" height="8.5" rx="3.5" fill="#d98e3a" opacity="0.9" stroke="#24352c" stroke-width="2"/>
    <line x1="47" y1="42" x2="49" y2="42" stroke="#24352c" stroke-width="2"/>
    <line x1="35.5" y1="43" x2="33" y2="43" stroke="#24352c" stroke-width="2"/>
    <line x1="60.5" y1="43" x2="63" y2="43" stroke="#24352c" stroke-width="2"/>
    <!-- the grin of a man who put radio on the internet -->
    <path d="M41.5 53 Q48 59.5 54.5 53 C52.5 57.5 43.5 57.5 41.5 53 Z" fill="#ffffff" stroke="#24352c" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <circle cx="48" cy="48" r="45" fill="none" stroke="#24352c" stroke-width="2.4"/>
</svg>
